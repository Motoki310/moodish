<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者用:入力データ一覧 | デートレストラン提案サイト(プロトタイプ)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">🌸 デートスポット提案 <span class="beta">β</span></a>
    <nav class="header-nav">
      <a href="index.html" class="admin-link">提案フォームに戻る</a>
    </nav>
  </div>
</header>

<main class="page admin-page">

  <section class="intro">
    <h1>管理者用:入力データ一覧</h1>
    <p>ユーザーがフォームから送信した内容を、この端末のブラウザ内(localStorage)に保存して一覧表示しています。<br>
    サーバー保存ではないため、他の端末・他のブラウザのデータは表示されません。</p>
  </section>

  <div class="admin-toolbar">
    <span id="entry-count" class="entry-count">0件の送信データ</span>
    <div class="admin-actions">
      <button id="export-btn" class="btn-secondary" type="button">JSONで書き出し</button>
      <button id="clear-btn" class="btn-danger" type="button">全データを削除</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>送信日時</th>
          <th>目的・関係性</th>
          <th>場所</th>
          <th>予算/1人</th>
          <th>シーン</th>
          <th>希望日時</th>
          <th>ジャンル</th>
          <th>席</th>
          <th>雰囲気</th>
          <th>NG(苦手料理・アレルギー・喫煙)</th>
        </tr>
      </thead>
      <tbody id="admin-table-body">
        <!-- JSで挿入 -->
      </tbody>
    </table>
    <p id="empty-state" class="empty-state hidden">まだ送信データがありません。提案フォームから送信すると、ここに表示されます。</p>
  </div>

</main>

<footer class="site-footer">
  <p>デートレストラン提案サイト(プロトタイプ) / 管理者専用ページ</p>
</footer>

<script src="js/admin.js"></script>
</body>
</html>
